name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: '8.5'
  NODE_VERSION: '24'

jobs:
  quality:
    name: Lint, análise estática e auditoria
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: intl, pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci
          cp .env.example .env
          php artisan key:generate
          php artisan wayfinder:generate --with-form

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Lint e formatação (JS/Vue)
        run: npm run check

      - name: Tipos (TS/Vue)
        run: npm run types:check

      - name: Auditoria de dependências
        run: |
          composer audit
          npm audit --audit-level=high

  tests:
    name: Testes (Unit + Feature) com cobertura
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: academy_testing
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academy"
          --health-interval 5s
          --health-retries 10

    env:
      DB_PORT: 5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: intl, pdo_pgsql, redis
          tools: composer:v2
          coverage: pcov

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate

      - name: Pest
        run: php artisan test --testsuite=Unit,Feature --parallel --coverage --min=80

  browser:
    name: Testes de browser (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: academy_testing
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academy"
          --health-interval 5s
          --health-retries 10

    env:
      DB_PORT: 5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: intl, pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies and build assets
        run: |
          composer install --no-interaction --prefer-dist
          npm ci
          cp .env.example .env
          php artisan key:generate
          npm run build
          npx playwright install --with-deps chromium

      - name: Pest (browser)
        run: vendor/bin/pest --testsuite=Browser

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots
          if-no-files-found: ignore

  docker:
    name: Build das imagens
    runs-on: ubuntu-latest
    needs: [quality, tests, browser]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (e push no main) — app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/bartolomeusilva/academy:${{ github.sha }}
            ghcr.io/bartolomeusilva/academy:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build (e push no main) — video-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: video-worker
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/bartolomeusilva/academy-video-worker:${{ github.sha }}
            ghcr.io/bartolomeusilva/academy-video-worker:latest
          cache-from: |
            type=gha,scope=app
            type=gha,scope=video-worker
          cache-to: type=gha,mode=max,scope=video-worker
